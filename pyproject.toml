[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-qnlp"
version = "0.1.0"
description = "Grammar-aware quantum NLP for classifying tactical motifs in chess puzzle comments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "numpy>=2.0",
    "pandas>=2.2",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "iterative-stratification>=0.1.9",
    "torch>=2.9",
    "lambeq==0.5.0",
    "pennylane>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
